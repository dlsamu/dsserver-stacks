# Local DNS records for the home LAN (rubusdua.net). Served identically by both resolvers
# (dsserver and Beacon). One line per host: host-record=<name>,<IPv4>. host-record also answers the
# reverse (PTR) lookup. Only these exact names are answered locally; every other rubusdua.net name
# (stockpulse, _acme-challenge TXT, ...) is forwarded to the public DNS unchanged.
# Keep the IPs in line with the Deco address reservations.
host-record=dsserver.rubusdua.net,192.168.68.115
host-record=beacon.rubusdua.net,192.168.68.121
host-record=dsnas.rubusdua.net,192.168.68.112
host-record=replay.rubusdua.net,192.168.68.125
host-record=dataserver.rubusdua.net,192.168.68.119
