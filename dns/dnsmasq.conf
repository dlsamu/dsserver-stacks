# Local DNS resolver (dnsmasq, DNS only) for the home LAN. Identical on dsserver and Beacon.
# Design and operations: /srv/stacks/dns/README.md. Installed as /etc/local-dns/dnsmasq.conf.
# The per-host listen address is in /etc/local-dns/listen.conf (written by local-dns.sh).

# --- DNS only. dnsmasq never does DHCP unless a dhcp-range is configured; there is none, and
#     local-dns.sh verify checks that nothing listens on port 67.
port=53

# --- Where to listen: loopback plus the host's LAN address (listen.conf). bind-dynamic binds only
#     those addresses (not 0.0.0.0) and copes with the address appearing after start.
bind-dynamic
listen-address=127.0.0.1
listen-address=::1
conf-file=/etc/local-dns/listen.conf

# --- Upstream: fixed public resolvers, never /etc/resolv.conf. This avoids a circular dependency
#     once the Deco hands out these resolvers to the hosts themselves. The ISP resolvers come first
#     (what the LAN uses today); Cloudflare and Quad9 keep internet names working if the ISP DNS fails.
no-resolv
no-poll
server=2.248.248.2
server=2.248.248.248
server=1.1.1.1
server=9.9.9.9

# --- Local names come only from records.conf (not from /etc/hosts of this host).
no-hosts
conf-file=/etc/local-dns/records.conf
local-ttl=60

# --- Hygiene: never forward plain single-label names or private reverse lookups to the internet.
domain-needed
bogus-priv

cache-size=2000

# --- Privileges: dnsmasq starts as root to bind port 53, then runs as the unprivileged user.
user=dnsmasq
group=nogroup
pid-file=
