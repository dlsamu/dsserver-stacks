# Cloudflare Tunnel connector for dsserver. TEMPLATE - NOT DEPLOYED. Design: docs/external-access.md.
# Outbound-only (no published port, no firewall or router change). Reaches ONLY Caddy on the "proxy"
# network; every public hostname is an explicit route in routes.toml (render.py), everything else -> 404.
# Secrets (never in Git): /etc/dsserver-secrets/cloudflared/credentials.json (tunnel credentials, root:65532 0640)
# Generated config:      /etc/dsserver-secrets/cloudflared/config.yml (render.py output, root 0644)
# Image pinned by digest (2026.10.7, published 2026-10-30); re-check for a newer release at activation.
name: tunnel
services:
  cloudflared:
    image: cloudflare/cloudflared:2026.10.7@sha256:4955524aeaa379e154023d5a027c250f7b35041a2e7e950cf13f144bc9b9c5ba
    container_name: tunnel-cloudflared
    command: ["tunnel", "--config", "/etc/cloudflared/config.yml", "run"]
    restart: unless-stopped
    user: "65532:65532"                       # the image's nonroot user
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [proxy]
    volumes:
      - {type: bind, source: /etc/dsserver-secrets/cloudflared, target: /etc/cloudflared, read_only: true,
         bind: {create_host_path: false}}
    healthcheck:                              # verify at activation that this version has `tunnel ready`
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:2000", "ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    mem_limit: 128m
    pids_limit: 64
    logging:
      driver: local
      options: {max-size: "5m", max-file: "3"}

networks:
  proxy:
    external: true
