# Caddy (HTTPS reverse proxy) on Beacon. Deployed to /srv/beacon/compose/caddy by scripts/deploy.sh;
# built, started and checked with scripts/https.sh (README "HTTPS").
# Data: /srv/appdata/caddy (ACME account key + certificates; root 0700).
# Secret: /etc/beacon-secrets/cloudflare.env (CF_API_TOKEN=..., root 0600, never in Git).
name: caddy
services:
  caddy:
    build: .
    image: beacon-caddy:2.11.9-cf0.2.4
    container_name: caddy
    restart: unless-stopped
    # Host networking like the hub: Beacon's nftables rules (443/tcp from the LAN only) apply directly,
    # and the hub is reached on 127.0.0.1:8090.
    network_mode: host
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    env_file:
      - path: /etc/beacon-secrets/cloudflare.env
        required: true
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/appdata/caddy/data:/data
      - /srv/appdata/caddy/config:/config
    tmpfs:
      - /run/caddy:size=1m
      - /tmp:size=16m
    logging:
      driver: local
      options: {max-size: "10m", max-file: "3"}
    mem_limit: 256m
