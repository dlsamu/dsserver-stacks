# Beszel hub on Beacon. Deployed to /srv/beacon/compose/beszel by scripts/deploy.sh.
# Data: /srv/appdata/beszel (PocketBase: settings, users, systems, alerts, 30-day metrics).
# Optional secrets: hub.env next to this file on Beacon (root 0600, never in Git), e.g. HEARTBEAT_URL.
name: beszel
services:
  hub:
    image: henrygd/beszel:0.21.1@sha256:8514a69d9bbbcb74f371a3205561ee231fc0289739cea64e8131f341d695b770
    container_name: beszel-hub
    restart: unless-stopped
    # Host networking: the hub listens on :8090 directly, so Beacon's nftables input rules (LAN only)
    # apply without Docker NAT/forward rules in between. Agents connect to it; it dials nothing local.
    network_mode: host
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      APP_URL: http://beacon.local:8090
    env_file:
      - path: hub.env
        required: false
    volumes:
      - /srv/appdata/beszel:/beszel_data
    healthcheck:
      test: ["CMD", "/beszel", "health", "--url", "http://127.0.0.1:8090"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: local
      options: {max-size: "10m", max-file: "3"}
    # Needs the memory cgroup (enabled by setup-base.sh: cgroup_enable=memory in cmdline.txt).
    mem_limit: 512m
