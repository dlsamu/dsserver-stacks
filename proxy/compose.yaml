# Caddy (HTTPS reverse proxy) on dsserver. Managed only with the delegated
# host/scripts/14-https-proxy.sh, which runs this file from the root-owned snapshot.
# Image: the same Dockerfile as Beacon (beacon/compose/caddy). Data: /srv/appdata/proxy (root 0700).
# Secret: /etc/dsserver-secrets/cloudflare.env (CF_API_TOKEN=..., root 0600, never in Git).
name: proxy
services:
  caddy:
    build:
      context: ../beacon/compose/caddy
    image: dsserver-caddy:2.11.9-cf0.2.4
    container_name: proxy-caddy
    restart: unless-stopped
    # Scope lan (docs/network-access.md): reachable from the LAN only once 443 is in lan_tcp.
    ports:
      - "443:443/tcp"
    networks: [proxy]
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    env_file:
      - path: /etc/dsserver-secrets/cloudflare.env
        required: true
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/appdata/proxy/data:/data
      - /srv/appdata/proxy/config:/config
    tmpfs:
      - /run/caddy:size=1m
      - /tmp:size=16m
    logging:
      driver: local
      options: {max-size: "10m", max-file: "3"}
    mem_limit: 256m

networks:
  proxy:
    name: proxy
